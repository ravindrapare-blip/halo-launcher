name: Build Halo APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Find the project folder
        run: |
          FILE=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "::error::Project files are not in this repository. Upload the CONTENTS of the halo-launcher folder (app, gradle, settings.gradle.kts, build.gradle.kts ...)."
            echo "Files found in the repository:"
            find . -maxdepth 3 -not -path "./.git*" | head -n 60
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Project found in: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/output/Halo.apk"

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: Halo-APK
          path: output/Halo.apk
